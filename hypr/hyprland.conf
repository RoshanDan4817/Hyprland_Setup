env = AQ_NO_MODIFIERS,1


# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

autogenerated = 0

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu

# Prt Sc -> Full-screen snapshot using the local script
bind = , Print, exec, /home/roshand/.config/hypr/take-screenshot.sh screen

# Super + Shift + S -> Area selection snapshot using the local script
bind = SUPER SHIFT, S, exec, /home/roshand/.config/hypr/take-screenshot.sh area

debug:disable_config_warning = true

# === XWAYLAND VIDEO BRIDGE FIX ===
windowrule {
    name = hide_xwaylandvideobridge
    match:class = ^(xwaylandvideobridge)$
    opacity = 0.0
    no_anim = true
    no_initial_focus = true
    no_blur = true
}

# === UNIVERSAL VIDEO BRIDGE FORCE MASK ===
windowrule = opacity 0.0 override 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim 1, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur 1, match:class ^(xwaylandvideobridge)$

# === XWAYLAND VIDEO BRIDGE HYPRLAND SYNTAX FIX ===
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$


misc {
	mouse_move_enables_dpms = true
	key_press_enables_dpms = true
}

# 1. Internal Laptop Display (1080p starting at the top left coordinate 0x0)
monitor = eDP-1, 1920x1080@60, 0x0, 1

# 2. External Dell Monitor (Forces full 1080p, positioned immediately to the right at 1920x0)
monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1
source = ~/.config/hypr/monitors.conf
